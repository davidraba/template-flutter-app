# Codemagic CI/CD configuration.
#
# Triggering rules:
#   * Push to `main`  -> builds Web and publishes to Codemagic Static Pages
#
# Android and iOS builds are intentionally NOT automated here. They can be
# run on demand from the Codemagic UI.
#
# Branch triggers can also be configured from the Codemagic UI under
# App settings -> Workflow -> Triggering.
#
# Codemagic Static Pages publishing is configured in the Codemagic UI under
# App settings -> Distribution -> Codemagic Static Pages (set the subdomain
# there; the build artifact `build/web` will be deployed automatically once
# the workflow finishes successfully).

workflows:
  web-main:
    name: Web (publish to Codemagic Static Pages)
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Run static analysis
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build web
        script: flutter build web --release
    artifacts:
      - build/web
      - web
    publishing:
      email:
        recipients:
          - david.raba@hipra.com
        notify:
          success: true
          failure: true
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: feature/*
          include: false
        - pattern: fix/*
          include: false
